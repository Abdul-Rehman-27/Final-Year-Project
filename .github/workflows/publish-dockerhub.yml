name: Build and publish Docker images

on:
  push:
    branches: [main, master, feature/medical-assistant-chat-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image names and tags
        id: meta
        shell: bash
        run: |
          echo "namespace=${DOCKERHUB_USERNAME,,}" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and push CityHospital backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.namespace }}/${{ steps.meta.outputs.repository }}-backend:latest
            ${{ steps.meta.outputs.namespace }}/${{ steps.meta.outputs.repository }}-backend:${{ steps.meta.outputs.tag }}

      - name: Build and push CityHospital frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.namespace }}/${{ steps.meta.outputs.repository }}-frontend:latest
            ${{ steps.meta.outputs.namespace }}/${{ steps.meta.outputs.repository }}-frontend:${{ steps.meta.outputs.tag }}

      - name: Build and push Medical Assistant backend
        uses: docker/build-push-action@v6
        with:
          context: ./medical-assistant/backend
          push: true
          tags: |
            ${{ steps.meta.outputs.namespace }}/${{ steps.meta.outputs.repository }}-medical-assistant-backend:latest
            ${{ steps.meta.outputs.namespace }}/${{ steps.meta.outputs.repository }}-medical-assistant-backend:${{ steps.meta.outputs.tag }}

      - name: Build and push Medical Assistant frontend
        uses: docker/build-push-action@v6
        with:
          context: ./medical-assistant/frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.namespace }}/${{ steps.meta.outputs.repository }}-medical-assistant-frontend:latest
            ${{ steps.meta.outputs.namespace }}/${{ steps.meta.outputs.repository }}-medical-assistant-frontend:${{ steps.meta.outputs.tag }}
