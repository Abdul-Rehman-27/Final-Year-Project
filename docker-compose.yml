# CityHospital: three containers, started together with one command:
#   docker compose up --build
#
#   db   PostgreSQL holding two databases:  cityhospital  and  medical_assistant
#   api  one container running BOTH FastAPI servers (project :8000, Medical Assistant :8010)
#   web  one container serving BOTH frontends     (project :5173, Medical Assistant :5174)
name: cityhospital

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: cityhospital
      POSTGRES_PASSWORD: cityhospital
      POSTGRES_DB: cityhospital          # project database; 01-create-databases.sh adds medical_assistant
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityhospital -d cityhospital"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    # Secrets (SECRET_KEY, GROQ_API_KEY, SMTP_*, SEED_*) come from backend/.env.
    # The values under "environment" below win over anything in these files.
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./medical-assistant/.env
        required: false
    environment:
      # Project API -> project database
      DATABASE_URL: postgresql+psycopg2://cityhospital:cityhospital@db:5432/cityhospital
      # Medical Assistant API -> its own database
      MEDICAL_ASSISTANT_DATABASE_URL: postgresql+psycopg2://cityhospital:cityhospital@db:5432/medical_assistant
      # The clinical summarizer reads patient records from the project database
      SUMMARIZER_DATABASE_URL: postgresql+psycopg2://cityhospital:cityhospital@db:5432/cityhospital
      RECORD_SOURCE: cityhospital
      # Both servers share this container, so the project API reaches the assistant on localhost
      MEDICAL_ASSISTANT_URL: http://localhost:8010
      MEDICAL_ASSISTANT_API_KEY: ""
      MEDICAL_ASSISTANT_API_KEYS: ""
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      # Optional local fallback model: Ollama running on the host machine
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"   # CityHospital API  (docs: /docs)
      - "8010:8010"   # Medical Assistant API (docs: /docs)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=5); u.urlopen('http://127.0.0.1:8010/api/v1/health', timeout=20)"]
      interval: 15s
      timeout: 25s
      retries: 8
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        # Addresses the browser uses. Change them if you open the app from another computer.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_MEDICAL_ASSISTANT_FRONTEND_URL: ${VITE_MEDICAL_ASSISTANT_FRONTEND_URL:-http://localhost:5174}
        VITE_DOCTOR_API_MODE: live
    restart: unless-stopped
    ports:
      - "5173:5173"   # CityHospital app
      - "5174:5174"   # Medical Assistant app (also embedded in the patient portal)
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
