# Docker's internal DNS, so the API container can be restarted without restarting nginx.
resolver 127.0.0.11 valid=10s;

# CityHospital project frontend (patient / doctor / admin portals).
server {
    listen 5173;
    root /usr/share/nginx/html/project;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Medical Assistant frontend. The patient portal embeds this one in an iframe.
server {
    listen 5174;
    root /usr/share/nginx/html/assistant;
    index index.html;

    location /api/ {
        set $assistant_api http://api:8010;
        proxy_pass $assistant_api;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
